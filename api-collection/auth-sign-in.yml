info:
  name: auth-sign-in
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/api/auth/sign-in/email"
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{client_origin}}"
  body:
    type: json
    data: |-
      {
        "email": "steve@gmail.com",
        "password": "password",
        "rememberMe": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("signin succeeds", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
