info:
  name: auth-sign-up
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/api/auth/sign-up/email"
  headers:
    - name: Content-Type
      value: application/json
    - name: Origin
      value: "{{client_origin}}"
  body:
    type: json
    data: |-
      {
        "name": "steve",
        "email": "steve@gmail.com",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("signup returns success status", function () {
          expect([200, 201]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
